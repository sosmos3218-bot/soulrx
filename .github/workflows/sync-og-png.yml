name: Sync OG PNG
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public/og.png from production
        run: |
          mkdir -p public
          curl -fsSL "https://soulrx.vercel.app/og.png" -o public/og.png
          python3 - <<'PY'
          p = open("public/og.png", "rb").read()
          assert p[:8] == b"\x89PNG\r\n\x1a\n", p[:8]
          print("ok", len(p))
          PY
      - name: Commit and push
        run: |
          git config user.name "sosmos3218-bot"
          git config user.email "sosmos3218@gmail.com"
          git add public/og.png
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Add public/og.png for Open Graph"
          git push
