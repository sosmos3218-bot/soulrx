name: Sync OG PNG
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write public/og.png from scripts/og-parts
        run: node scripts/write-og-png.mjs
      - name: Commit and push
        run: |
          git config user.name "sosmos3218-bot"
          git config user.email "sosmos3218@gmail.com"
          git add public/og.png
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Add public/og.png for Open Graph"
          git push
