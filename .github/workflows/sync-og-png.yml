name: Sync OG PNG
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble binary og.png from base64 parts
        run: |
          cat public/og.part*.b64 | base64 -d > public/og.png
          python3 - <<'PY'
          p=open("public/og.png","rb").read(8)
          assert p[:8]==b"\x89PNG\r\n\x1a\n", p[:8]
          print("ok", __import__("os").path.getsize("public/og.png"))
          PY
          rm -f public/og.part*.b64
      - name: Commit and push
        run: |
          git config user.name "sosmos3218-bot"
          git config user.email "sosmos3218@gmail.com"
          git add public/og.png
          git add -u public/og.part*.b64 || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Add public/og.png for Open Graph"
          git push
